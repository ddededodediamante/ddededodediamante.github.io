<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Pregnan">
    <meta property="og:description" content="Am i pregnan">
    <meta property="og:url" content="https://ddededodediamante.github.io/pregnan/">
    <title>Pregnan</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: static;
        }

        video {
            position: fixed;
            width: 100%;
            height: 100%;
            object-fit: fill;
            opacity: 0;
            visibility: hidden;
        }

        button {
            position: fixed;
            top: 10px;
            left: 10px;
        }
    </style>
</head>
<body>
    <button id="buttocks" onclick="play()">Am I pregnan</button>
    <video id="pregnancy" src="https://ddededodediamante.github.io/file/pregnan.mp4" type="video/mp4" paused="true" loop="true">
    <script>
        function play() {
            document.getElementById("buttocks").style.display = 'none';
            const video = document.getElementById("pregnancy");
            video.style.visibility = 'visible';
            video.style.opacity = '1';
            video.play();
        }
    </script>
</body>
</html>
